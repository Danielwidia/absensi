<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi - Sekolah Kristen Dorkas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    .animate-pulse-fast { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .table-container::-webkit-scrollbar, .tab-nav::-webkit-scrollbar { height: 6px; }
    .table-container::-webkit-scrollbar-track, .tab-nav::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .table-container::-webkit-scrollbar-thumb, .tab-nav::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .glass-gradient-top {
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.9) 35%, rgba(255, 255, 255, 0.98) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    @keyframes floatSlow { 0% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-18px) scale(1.03); } 100% { transform: translateY(0px) scale(1); } }
    .animate-float-slow { animation: floatSlow 7s ease-in-out infinite; }
    @keyframes floatCloud { 0% { transform: translateX(0px); } 50% { transform: translateX(25px); } 100% { transform: translateX(0px); } }
    .animate-cloud { animation: floatCloud 12s ease-in-out infinite; }
    @keyframes realisticGlow { 0%, 100% { box-shadow: 0 0 40px 10px rgba(255, 204, 0, 0.4), 0 0 80px 30px rgba(255, 102, 0, 0.2); } 50% { box-shadow: 0 0 60px 20px rgba(255, 221, 0, 0.6), 0 0 110px 40px rgba(255, 136, 0, 0.3); } }
    .realistic-sun { background: radial-gradient(circle at 30% 30%, #fff700, #ff8800); animation: realisticGlow 4s ease-in-out infinite, floatSlow 6s ease-in-out infinite; }
    @keyframes realisticMoon { 0%, 100% { box-shadow: inset -12px -4px 0px 2px rgba(255,255,255,0.8), 0 0 35px 10px rgba(200,220,255,0.3); } 50% { box-shadow: inset -12px -4px 0px 2px rgba(255,255,255,0.9), 0 0 50px 18px rgba(200,220,255,0.5); } }
    .realistic-moon { background: radial-gradient(circle at 35% 35%, #ffffff, #cfd8dc); animation: realisticMoon 5s ease-in-out infinite, floatSlow 8s ease-in-out infinite; }
    .realistic-cloud { background: linear-gradient(to bottom, rgba(255,255,255,0.95), rgba(240,244,248,0.7)); backdrop-filter: blur(8px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-radius: 50px; }
    @keyframes starTwinkle { 0%, 100% { opacity: 0.2; transform: scale(0.7); filter: drop-shadow(0 0 2px rgba(255,255,255,0.3)); } 50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 8px rgba(255,255,255,0.9)); } }
    .realistic-star { animation: starTwinkle 3s ease-in-out infinite; }
  </style>
</head>

<body id="main-body" class="bg-gray-100 min-h-screen font-sans py-10 px-4 transition-colors duration-1000 relative overflow-x-hidden">

    <!-- ================= DASHBOARD PAGE (ABSENSI) ================= -->

      <!-- Tombol Absen -->

        <button id="btn-pulang" class="flex items-center justify-center gap-2 text-white py-3 px-4 rounded-xl shadow-md font-bold text-sm transition-all"></button>

      <!-- Form Izin Dropdown -->

          <span class="flex items-center gap-2"><i class="fa-solid fa-envelope-open-text text-gray-500"></i> Form Izin</span>
          <i id="izin-icon" class="fa-solid fa-chevron-down transition-transform"></i>
        </button>
        <div id="izin-content" class="p-5 hidden border-t border-gray-100 bg-white/95 space-y-3">

        </div>

      <button onclick="logout()" class="w-full mt-2 bg-red-50 text-red-600 font-bold py-3 rounded-xl border border-red-100"><i class="fa-solid fa-power-off mr-2"></i> Keluar</button>
    </div>
  </div>

  <script>
    // MASUKKAN LINK WEB APP GOOGLE SCRIPT ANDA DI BAWAH INI
    const API_URL = "https://script.google.com/macros/s/AKfycbxcAzs2OiCwQP4W_rUEFqSzbk2Bri9qLUZEpuEWwkL7LXTE6syid7d51xJFAlcyBJ_9ag/exec";

    let currentUser = '', currentRole = '', tipeAbsenSekarang = '';
    let latSekolah = 0, lonSekolah = 0, userLat, userLon, isInRadius = false, fotoBase64Data = '';
    let cachedDataSiswa = [], cachedDataKBTK = [], cachedDataSD = [], cachedDataSMP = [], currentStartDate = '', currentEndDate = '';

    // Variabel Status Absen Hari Ini
    let statusSudahMasuk = false;
    let statusSudahPulang = false;
    let statusSudahIzin = false;

async function callAPI(payload, retries = 3) {
      for (let i = 0; i < retries; i++) {
        try {
          let response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(payload),
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            redirect: "follow" // Memastikan browser mengikuti redirect Google
          });

          if (!response.ok) {
            // Jika gagal dan masih ada sisa percobaan, ulangi
            if (i < retries - 1) {
              console.warn(`[Retry ${i+1}/${retries}] Google merespon ${response.status}. Mencoba ulang...`);
              await new Promise(resolve => setTimeout(resolve, 1000));
              continue; 
            }
            
            // JIKA TETAP GAGAL DI PERCOBAAN TERAKHIR DAN STATUSNYA 404
            if (response.status === 404) {
              throw new Error("Maaf, server sedang sibuk. Silakan coba beberapa saat lagi.");
            }
            throw new Error("Server merespon dengan status: " + response.status);
          }

          const text = await response.text();
          try {
            return JSON.parse(text);
          } catch (e) {
            console.error("Gagal parsing JSON. Respon server:", text);
            // Tangkap juga error jika server Google overload dan malah mengirim halaman HTML
            if (text.includes("<!DOCTYPE") || text.includes("<html")) {
              throw new Error("Maaf, server sedang sibuk. Silakan coba beberapa saat lagi.");
            }
            throw new Error("Format data dari server tidak valid.");
          }
        } catch (err) {
          // Jika ini adalah percobaan terakhir, kembalikan pesan error kustom tersebut
          if (i === retries - 1) {
            console.error("Detail Error:", err);
            return { success: false, message: err.message };
          }
          // Jeda sebelum mencoba ulang jika terjadi error jaringan
          await new Promise(resolve => setTimeout(resolve, 1500));
        }
      }
    }

    function toggleFormIzin() {
      document.getElementById('izin-content').classList.toggle('hidden');
      document.getElementById('izin-icon').classList.toggle('rotate-180');
    }

    function setAtmosphere() {
      const hour = new Date().getHours();
      const body = document.getElementById('main-body');
      const decor = document.getElementById('theme-decorations');
      let bgClass = '', decorHtml = '';
    
      if (hour >= 4 && hour < 11) {
        // Pagi: Matahari di kiri, dinaikkan ke top-4
        bgClass = 'bg-gradient-to-br from-sky-200 via-blue-200 to-indigo-200';
        decorHtml = `<div class="absolute top-4 left-12 w-20 h-20 rounded-full realistic-sun"></div><div class="absolute top-16 right-16 w-36 h-12 realistic-cloud animate-cloud opacity-80"></div><div class="absolute top-36 left-28 w-24 h-8 realistic-cloud animate-cloud opacity-60" style="animation-delay: 4s;"></div>`;
      } else if (hour >= 11 && hour < 15) {
        // Siang: Matahari di kanan atas, dinaikkan ke top-4
        bgClass = 'bg-gradient-to-br from-blue-300 via-sky-300 to-cyan-300';
        decorHtml = `<div class="absolute top-4 right-16 w-24 h-24 rounded-full realistic-sun"></div><div class="absolute top-12 left-10 w-40 h-14 realistic-cloud animate-cloud opacity-90"></div><div class="absolute top-48 right-8 w-32 h-10 realistic-cloud animate-cloud opacity-70" style="animation-delay: 3s;"></div>`;
      } else if (hour >= 15 && hour < 18) {
        // Sore: Matahari di kanan, dinaikkan ke top-4
        bgClass = 'bg-gradient-to-br from-orange-200 via-amber-300 to-rose-300';
        decorHtml = `<div class="absolute top-4 right-10 w-24 h-24 rounded-full realistic-sun"></div><div class="absolute top-28 left-16 w-44 h-14 realistic-cloud animate-cloud opacity-60"></div>`;
      } else {
        // Malam: Bulan di kanan, dinaikkan ke top-4
        bgClass = 'bg-gradient-to-br from-slate-950 via-indigo-950 to-purple-950';
        decorHtml = `<div class="absolute top-4 right-16 w-20 h-20 rounded-full realistic-moon"></div><div class="absolute top-12 left-12 w-1.5 h-1.5 bg-white rounded-full realistic-star"></div><div class="absolute top-24 left-36 w-2 h-2 bg-white rounded-full realistic-star" style="animation-delay: 1s;"></div><div class="absolute top-8 left-60 w-1.5 h-1.5 bg-white rounded-full realistic-star" style="animation-delay: 2s;"></div>`;
      }
      
      body.className = `min-h-screen font-sans py-10 px-4 transition-colors duration-1000 relative overflow-x-hidden ${bgClass}`;
      decor.innerHTML = decorHtml;
    }

    window.onload = function() {
      setAtmosphere();
      const savedUser = localStorage.getItem('dorkas_user');
      const savedPass = localStorage.getItem('dorkas_pass');
      if (savedUser && savedPass) {
        document.getElementById('log-user').value = savedUser;
        document.getElementById('log-pass').value = savedPass;
        document.getElementById('remember-me').checked = true;
      }
    };

    function togglePasswordVisibility() {
      const passInput = document.getElementById('log-pass');
      const toggleIcon = document.getElementById('toggle-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
      } else {
        passInput.type = 'password';
        toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
      }
    }

    function showPage(pageId) {
      ['login-page', 'register-page', 'dashboard-page', 'admin-page'].forEach(id => document.getElementById(id).classList.add('hidden'));
      const appCont = document.getElementById('app-container');
      if(pageId === 'admin-page') {
        appCont.classList.remove('max-w-md'); appCont.classList.add('max-w-3xl');
      } else {
        appCont.classList.add('max-w-md'); appCont.classList.remove('max-w-3xl');
      }
      document.getElementById(pageId).classList.remove('hidden');
    }

    // ================= PENGATURAN TOMBOL ABSEN =================
    function renderTombolAbsen() {
      const btnMasuk = document.getElementById('btn-masuk');
      const btnPulang = document.getElementById('btn-pulang');
      const btnIzin = document.getElementById('btn-izin');
      const ketIzin = document.getElementById('ket-izin');

      // 1. Logika Tombol Masuk
      if (statusSudahIzin) {
        btnMasuk.onclick = () => alert("Anda sudah izin hari ini!");
        btnMasuk.className = "flex items-center justify-center gap-2 bg-gray-400 text-white py-3 px-4 rounded-xl shadow-sm font-bold text-sm cursor-not-allowed";
        btnMasuk.innerHTML = `<i class="fa-solid fa-ban"></i> IZIN`;
      } else if (statusSudahMasuk) {
        btnMasuk.onclick = () => alert("Anda sudah melakukan absen MASUK hari ini!");
        btnMasuk.className = "flex items-center justify-center gap-2 bg-gray-400 text-white py-3 px-4 rounded-xl shadow-sm font-bold text-sm cursor-not-allowed";
        btnMasuk.innerHTML = `<i class="fa-solid fa-check"></i> SUDAH MASUK`;
      } else {
        btnMasuk.onclick = () => siapkanAbsen('Masuk');
        btnMasuk.className = "flex items-center justify-center gap-2 bg-gradient-to-br from-blue-500 to-blue-600 text-white py-3 px-4 rounded-xl shadow-md font-bold text-sm hover:shadow-lg transition-all";
        btnMasuk.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> MASUK`;
      }

      // 2. Logika Tombol Pulang
      if (statusSudahIzin) {
        btnPulang.onclick = () => alert("Anda izin hari ini, tidak perlu absen pulang.");
        btnPulang.className = "flex items-center justify-center gap-2 bg-gray-400 text-white py-3 px-4 rounded-xl shadow-sm font-bold text-sm cursor-not-allowed";
        btnPulang.innerHTML = `<i class="fa-solid fa-ban"></i> IZIN`;
      } else if (statusSudahPulang) {
        btnPulang.onclick = () => alert("Anda sudah melakukan absen PULANG hari ini!");
        btnPulang.className = "flex items-center justify-center gap-2 bg-gray-400 text-white py-3 px-4 rounded-xl shadow-sm font-bold text-sm cursor-not-allowed";
        btnPulang.innerHTML = `<i class="fa-solid fa-check-double"></i> SUDAH PULANG`;
      } else {
        btnPulang.onclick = () => siapkanAbsen('Pulang');
        btnPulang.className = "flex items-center justify-center gap-2 bg-gradient-to-br from-orange-400 to-orange-500 text-white py-3 px-4 rounded-xl shadow-md font-bold text-sm hover:shadow-lg transition-all";
        btnPulang.innerHTML = `<i class="fa-solid fa-person-walking-arrow-right"></i> PULANG`;
      }

      // 3. Logika Form Izin
      if (statusSudahIzin) {
        btnIzin.onclick = () => alert("Anda sudah izin hari ini!");
        btnIzin.className = "w-full bg-gray-400 text-white font-bold py-3 rounded-xl shadow-sm cursor-not-allowed";
        btnIzin.innerHTML = `<i class="fa-solid fa-check"></i> IZIN SUDAH TERCATAT`;
        ketIzin.disabled = true;
        ketIzin.placeholder = "Anda sudah izin hari ini.";
      } else if (statusSudahMasuk) {
        btnIzin.onclick = () => alert("Anda sudah absen hadir, tidak bisa mengajukan izin!");
        btnIzin.className = "w-full bg-gray-400 text-white font-bold py-3 rounded-xl shadow-sm cursor-not-allowed";
        btnIzin.innerHTML = `<i class="fa-solid fa-ban"></i> TIDAK BISA IZIN`;
        ketIzin.disabled = true;
        ketIzin.placeholder = "Anda sudah hadir di sekolah.";
      } else {
        btnIzin.onclick = kirimIzin;
        btnIzin.className = "w-full bg-gray-700 hover:bg-gray-800 text-white font-bold py-3 rounded-xl shadow-md transition-all";
        btnIzin.innerHTML = `<i class="fa-solid fa-paper-plane mr-2"></i> Kirim Izin`;
        ketIzin.disabled = false;
        ketIzin.placeholder = "Alasan (Sakit / Keperluan lain)";
      }
    }

    // ================= FUNGSI AKUN & OTENTIKASI =================
    async function doRegister() {
      const nama = document.getElementById('reg-nama').value;
      const user = document.getElementById('reg-user').value;
      const pass = document.getElementById('reg-pass').value;
      const role = document.getElementById('reg-role').value;
      if(!nama || !user || !pass) return alert("Harap isi semua kolom!");

      let res = await callAPI({ action: 'register', nama, username: user, password: pass, role });
      alert(res.message);
      if(res.success) showPage('login-page');
    }

    async function doLogin() {
      // Selalu coba sinkronkan jadwal terbaru setiap kali tombol login ditekan
      // refreshJadwalFromServer();

      const user = document.getElementById('log-user').value;
      const pass = document.getElementById('log-pass').value;
      const rememberMe = document.getElementById('remember-me').checked;
      const btnLogin = document.getElementById('btn-login-submit');

      if(!user || !pass) return alert("Isi username dan password!");

      // Tampilan Tombol Loading
      const originalBtnContent = btnLogin.innerHTML;
      btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memproses...';
      btnLogin.disabled = true;
      btnLogin.classList.add('opacity-75', 'cursor-not-allowed');

      let res = await callAPI({ action: 'login', username: user, password: pass });

      // Kembalikan Tombol
      btnLogin.innerHTML = originalBtnContent;
      btnLogin.disabled = false;
      btnLogin.classList.remove('opacity-75', 'cursor-not-allowed');

      if(res.success) {
        if (rememberMe) {
          localStorage.setItem('dorkas_user', user); localStorage.setItem('dorkas_pass', pass);
        } else {
          localStorage.removeItem('dorkas_user'); localStorage.removeItem('dorkas_pass');
        }

        currentUser = res.nama;
        currentRole = res.role;

        // Simpan status absensi hari ini
        statusSudahMasuk = res.sudahMasuk;
        statusSudahPulang = res.sudahPulang;
        statusSudahIzin = res.sudahIzin;

        // Sinkronisasi Jadwal Notifikasi ke Android
        if (res.jadwal) {
          syncNotificationSchedule(res.jadwal);
        }

        if(currentRole === 'Admin') {
          showPage('admin-page');
          initAdminGPS();
          renderJadwalEditor(res.jadwal);
        } else {
          setGreeting();
          renderTombolAbsen();
          showPage('dashboard-page');
          initCekGPS();
          // Sinkronisasi jadwal saat login
          if (res.jadwal) syncNotificationSchedule(res.jadwal);
        }
      } else {
        alert(res.message || "Gagal masuk. Cek username dan password.");
      }
    }

    async function refreshJadwalFromServer() {
      try {
        let response = await fetch(`${API_URL}?action=getJadwal`);
        let res = await response.json();
        if (res.success && res.jadwal) {
          syncNotificationSchedule(res.jadwal);
        }
      } catch (e) {
        console.error("Gagal refresh jadwal:", e);
      }
    }

    function setGreeting() {
      const hour = new Date().getHours();
      let sapaan = (hour >= 4 && hour < 11) ? 'Pagi' : (hour >= 11 && hour < 15) ? 'Siang' : (hour >= 15 && hour < 18) ? 'Sore' : 'Malam';
      document.getElementById('greeting').innerHTML = `Halo, Selamat ${sapaan}! <br><span class="text-blue-600">${currentUser}</span>`;
    }

    function logout() {
      currentUser = ''; currentRole = '';
      statusSudahMasuk = false; statusSudahPulang = false; statusSudahIzin = false;
      document.getElementById('log-pass').value = localStorage.getItem('dorkas_pass') || '';
      showPage('login-page');
    }

    // ================= FUNGSI ADMIN =================
    async function initAdminGPS() {
       try {
         let response = await fetch(`${API_URL}?action=getGps`);
         let gps = await response.json();
         document.getElementById('admin-lat').value = gps.lat;
         document.getElementById('admin-lon').value = gps.lon;
       } catch (e) {
         console.error("Gagal load GPS Admin");
       }

    async function lihatData() {
      const start = document.getElementById('filter-start').value;
      const end = document.getElementById('filter-end').value;
      if(!start || !end) return alert('Pilih Tanggal Dari dan Tanggal Sampai terlebih dahulu!');

      const btn = document.getElementById('btn-lihat');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Loading...'; btn.disabled = true;

      let res = await callAPI({ action: 'getFilteredAbsensi', startDate: start, endDate: end });

      btn.innerHTML = '<i class="fa-solid fa-eye mr-1"></i> Tampilkan'; btn.disabled = false;
      if(!res.success && res.message) return alert(res.message);

      cachedDataSiswa = res.siswa; cachedDataKBTK = res.kbtk; cachedDataSD = res.sd; cachedDataSMP = res.smp;
      currentStartDate = start; currentEndDate = end;

      renderTableHTML('tabel-siswa', res.siswa);
      renderTableHTML('tabel-kbtk', res.kbtk);
      renderTableHTML('tabel-sd', res.sd);
      renderTableHTML('tabel-smp', res.smp);

      document.getElementById('data-preview-section').classList.remove('hidden');
      document.getElementById('btn-download').classList.remove('hidden');
    }

    function renderTableHTML(elementId, dataArray) {
      let html = '<table class="w-full text-left text-xs border-collapse">';
      if(dataArray.length <= 1) {
         html += '<tr><td class="p-6 text-center text-gray-500 italic">Tidak ada data.</td></tr>';
      } else {
         html += '<thead class="bg-indigo-50 text-indigo-800 uppercase"><tr>';
         dataArray[0].forEach(h => html += `<th class="p-3 border-b">${h}</th>`);
         html += '</tr></thead><tbody class="divide-y divide-gray-100">';
         for(let i = 1; i < dataArray.length; i++) {
            html += '<tr class="hover:bg-gray-50">';
            dataArray[i].forEach((cell, idx) => {
               if((idx === 5 || idx === 6) && cell && cell !== '-') {
                  html += `<td class="p-3 whitespace-nowrap"><a href="${cell}" target="_blank" class="text-blue-600 hover:underline"><i class="fa-solid fa-image"></i> Lihat</a></td>`;
               } else {
                  html += `<td class="p-3 whitespace-nowrap">${cell}</td>`;
               }
            });
            html += '</tr>';
         }
         html += '</tbody>';
      }
      html += '</table>';
      document.getElementById(elementId).innerHTML = html;
    }

    function switchTab(tabId) {
      ['siswa', 'kbtk', 'sd', 'smp'].forEach(t => {
        document.getElementById(`tab-btn-${t}`).className = (t === tabId) ? "px-5 py-3 text-sm font-bold text-indigo-600 border-b-2 border-indigo-600 bg-white" : "px-5 py-3 text-sm font-bold text-gray-500 hover:text-indigo-600 bg-gray-50";
        document.getElementById(`tabel-${t}`).classList.toggle('hidden', t !== tabId);
      });
    }

    function downloadExcel() {
      const workbook = XLSX.utils.book_new();
      if(cachedDataSiswa.length > 0) XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(cachedDataSiswa), "Siswa");
      if(cachedDataKBTK.length > 0) XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(cachedDataKBTK), "KB-TK");
      if(cachedDataSD.length > 0) XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(cachedDataSD), "SD");
      if(cachedDataSMP.length > 0) XLSX.utils.book_append_sheet(workbook, XLSX.utils.aoa_to_sheet(cachedDataSMP), "SMP");

      const fileName = `Laporan_Absensi_Dorkas_${currentStartDate}_sd_${currentEndDate}.xlsx`;

      try {
        const wbout = XLSX.write(workbook, {bookType:'xlsx', type:'base64'});
        const msg = {
          action: 'downloadBlob',
          data: wbout,
          mime: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          filename: fileName
        };

        if (window.AndroidInterface) {
          window.AndroidInterface.downloadBlob(wbout, msg.mime, 'filename=' + fileName);
        } else {
          // Relay untuk cross-origin iframe di Google Apps Script
          window.parent.postMessage(msg, '*');
          // Tetap jalankan download standar sebagai cadangan
          XLSX.writeFile(workbook, fileName);
        }
      } catch (e) {
        XLSX.writeFile(workbook, fileName);
      }
    }

    async function simpanGPS() {
      // Kita "bersihkan" inputan admin. Jika admin tak sengaja mengetik koma (,), akan otomatis diubah jadi titik (.)
      let rawLat = document.getElementById('admin-lat').value.replace(',', '.');
      let rawLon = document.getElementById('admin-lon').value.replace(',', '.');

      if(!rawLat || !rawLon) return alert('Latitude dan Longitude harus diisi!');

      let res = await callAPI({
        action: 'updateGps',
        lat: parseFloat(rawLat),
        lon: parseFloat(rawLon)
      });

      alert(res.message);

    // ================= FUNGSI JADWAL NOTIFIKASI =================
    function syncNotificationSchedule(jadwalJson) {
      if (window.AndroidInterface && jadwalJson) {
        window.AndroidInterface.updateReminders(jadwalJson);
        console.log("Jadwal notifikasi disinkronkan ke Android");
      }
    }

    function renderJadwalEditor(jadwalJson) {
      const container = document.getElementById('jadwal-container');
      const jadwal = JSON.parse(jadwalJson || '{}');
      const days = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

      // Fungsi pembantu untuk memastikan format jam adalah HH:mm (dengan nol di depan jika perlu)
      const fixTimeFormat = (timeStr) => {
        if (!timeStr || !timeStr.includes(':')) return "07:00";
        let [h, m] = timeStr.split(':');
        return `${h.padStart(2, '0')}:${m.padStart(2, '0')}`;
      };

      let html = '';
      days.forEach((dayName, index) => {
        const dayNum = (index + 1).toString();
        const timeData = jadwal[dayNum] ? jadwal[dayNum].split('|') : ["07:00", "15:00"];

        const jamMasuk = fixTimeFormat(timeData[0]);
        const jamPulang = fixTimeFormat(timeData[1]);

        html += `
          <div class="flex items-center gap-2 bg-white p-2 rounded-lg border border-blue-50">
            <span class="text-xs font-bold text-gray-600 w-16">${dayName}</span>
            <input type="time" id="masuk-${dayNum}" value="${jamMasuk}" class="text-xs p-1 border rounded">
            <span class="text-gray-400">-</span>
            <input type="time" id="pulang-${dayNum}" value="${jamPulang}" class="text-xs p-1 border rounded">
          </div>
        `;
      });
      container.innerHTML = html;
    }

    async function simpanJadwal() {
      const jadwal = {};
      for (let i = 1; i <= 6; i++) {
        const masuk = document.getElementById(`masuk-${i}`).value;
        const pulang = document.getElementById(`pulang-${i}`).value;
        jadwal[i.toString()] = `${masuk}|${pulang}`;
      }

      const jadwalJson = JSON.stringify(jadwal);
      let res = await callAPI({ action: 'updateJadwal', jadwal: jadwalJson });
      alert(res.message);
      if (res.success) {
        syncNotificationSchedule(jadwalJson);
      }
    }

    // ================= FUNGSI LOKASI & ABSENSI =================
    function updateGpsUI(status, message) {
      const box = document.getElementById('gps-box'), iconBg = document.getElementById('gps-icon-bg'), icon = document.getElementById('gps-icon'), text = document.getElementById('gps-status');
      text.innerText = message; icon.className = '';
      if(status === 'loading') {
        box.className = "bg-blue-50/95 border border-blue-100 p-3 rounded-xl flex items-center gap-3 mb-6";
        iconBg.className = "w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-500 shrink-0";
        icon.className = "fa-solid fa-location-crosshairs animate-pulse-fast";
        text.className = "text-sm font-semibold text-blue-700 leading-tight";
      } else if (status === 'success') {
        box.className = "bg-green-50/95 border border-green-200 p-3 rounded-xl flex items-center gap-3 mb-6";
        iconBg.className = "w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600 shrink-0";
        icon.className = "fa-solid fa-check-circle";
        text.className = "text-sm font-semibold text-green-700 leading-tight";
      } else {
        box.className = "bg-red-50/95 border border-red-200 p-3 rounded-xl flex items-center gap-3 mb-6";
        iconBg.className = "w-10 h-10 rounded-full bg-red-100 flex items-center justify-center text-red-600 shrink-0";
        icon.className = "fa-solid fa-triangle-exclamation";
        text.className = "text-sm font-semibold text-red-700 leading-tight";
      }
    }

    async function initCekGPS() {
      updateGpsUI('loading', 'Mengambil referensi GPS...');
      try {
        let response = await fetch(`${API_URL}?action=getGps`);
        let gps = await response.json();
        latSekolah = parseFloat(gps.lat);
        lonSekolah = parseFloat(gps.lon);

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(position => {
            userLat = position.coords.latitude;
            userLon = position.coords.longitude;
            let jarak = hitungJarak(latSekolah, lonSekolah, userLat, userLon);
            if(jarak <= 25) {
              isInRadius = true;
              updateGpsUI('success', `Valid: Anda di area sekolah (${Math.round(jarak)}m).`);
            } else {
              isInRadius = false;
              updateGpsUI('error', `Di Luar Area! Jarak Anda: ${Math.round(jarak)}m. (Maks: 25m)`);
            }
            // Sinkronkan jadwal notifikasi setiap kali GPS dicek (saat dashboard dibuka)
            refreshJadwalFromServer();
          }, err => {
            alert("Izinkan akses lokasi (GPS) pada browser Anda!");
            updateGpsUI('error', 'Akses GPS ditolak!');
          }, { enableHighAccuracy: true });
        }
      } catch (err) {
        updateGpsUI('error', 'Gagal memuat GPS server.');
      }
    }

    function hitungJarak(lat1, lon1, lat2, lon2) {
      const R = 6371e3, p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
      const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
      const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function siapkanAbsen(tipe) {
      if(!isInRadius) return alert("Anda di luar radius 150 meter dari sekolah!");

      if(tipe === 'Pulang' && !statusSudahMasuk) {
        return alert("Anda belum melakukan absen MASUK hari ini!");
      }

      tipeAbsenSekarang = tipe;
      document.getElementById('kamera-instruksi').innerText = `Absen ${tipe.toUpperCase()} - Ambil foto selfie Anda`;
      document.getElementById('tombol-absen-box').classList.add('hidden');
      document.getElementById('camera-box').classList.remove('hidden');
      document.getElementById('foto-input').value = '';
      document.getElementById('foto-preview').classList.add('hidden');
      document.getElementById('btn-snap').classList.add('hidden');
    }

    function previewFoto(event) {
      const file = event.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const originalBase64 = e.target.result;

        // Kompres foto sebelum ditampilkan dan diupload
        fotoBase64Data = await compressImage(originalBase64, 800, 800);

        document.getElementById('foto-preview').src = fotoBase64Data;
        document.getElementById('foto-preview').classList.remove('hidden');
        document.getElementById('btn-snap').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function compressImage(base64Str, maxWidth, maxHeight) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = base64Str;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxWidth) {
              height *= maxWidth / width;
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width *= maxHeight / height;
              height = maxHeight;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          // Kompres ke format JPEG dengan kualitas 0.7 (70%)
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
      });
    }

    function batalAbsen() {
      fotoBase64Data = '';
      document.getElementById('camera-box').classList.add('hidden');
      document.getElementById('tombol-absen-box').classList.remove('hidden');
    }

    async function simpanAbsen() {
      if(!fotoBase64Data) return alert("Ambil foto terlebih dahulu!");
      document.getElementById('camera-box').classList.add('hidden');
      document.getElementById('tombol-absen-box').classList.remove('hidden');
      updateGpsUI('loading', 'Menyimpan absensi & mengunggah foto...');

      let res = await callAPI({
        action: 'absen',
        tipe: tipeAbsenSekarang,
        nama: currentUser,
        keterangan: 'Hadir',
        fotoBase64: fotoBase64Data
      });

      alert(res.message);

      if (res.success) {
        if (tipeAbsenSekarang === 'Masuk') {
          statusSudahMasuk = true;
          // Beritahu Android bahwa sudah absen MASUK agar alarm tidak muncul hari ini
          if (window.AndroidInterface && window.AndroidInterface.markAsClockedIn) {
            window.AndroidInterface.markAsClockedIn('masuk');
          }
        }
        if (tipeAbsenSekarang === 'Pulang') {
          statusSudahPulang = true;
          // Beritahu Android bahwa sudah absen PULANG agar alarm tidak muncul hari ini
          if (window.AndroidInterface && window.AndroidInterface.markAsClockedIn) {
            window.AndroidInterface.markAsClockedIn('pulang');
          }
        }
        renderTombolAbsen();
      }

      fotoBase64Data = '';
      initCekGPS();
    }

    async function kirimIzin() {
      const ket = document.getElementById('ket-izin').value;
      if(!ket) return alert("Mohon isi keterangan izin.");

      let res = await callAPI({
        action: 'absen',
        tipe: 'Izin',
        nama: currentUser,
        keterangan: ket,
        fotoBase64: null
      });

      alert(res.message);

      if(res.success) {
        statusSudahIzin = true;
        statusSudahMasuk = true;
        statusSudahPulang = true;

        // Beritahu Android bahwa sudah absen (melalui izin) agar alarm tidak muncul hari ini
        if (window.AndroidInterface && window.AndroidInterface.markAsClockedIn) {
          window.AndroidInterface.markAsClockedIn('masuk');
          window.AndroidInterface.markAsClockedIn('pulang');
        }

        renderTombolAbsen();
      }

      document.getElementById('ket-izin').value = '';
      toggleFormIzin();
    }
  </script>
